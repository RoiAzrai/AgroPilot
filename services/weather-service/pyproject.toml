[project]
name = "weather-service"
version = "0.1.0"
description = "AgroPilot weather service."
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115",
    "httpx~=0.28",
    "pydantic-settings~=2.6",
    "uvicorn~=0.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest~=9.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
