<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgroPilot – Farms</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3EBDD}
a{color:#2F4A32}a:hover{color:#1E3322}
</style>
</helmet>
<div style="min-height: 100vh; background: #F3EBDD; font-family: Inter, system-ui, sans-serif; color: #3B2A1C">

  <header style="background: #2F4A32; color: #F3EBDD">
    <div style="max-width: 1120px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 10px">
      <span style="font-size: 13px; color: #CFE0C3; margin-right: 4px">Services</span>
      <sc-for list="{{services}}" as="s" hint-placeholder-count="3">
        <span style="display: inline-flex; align-items: center; gap: 8px; background: #3D5C40; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500">
          <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: {{s.dot}}; box-shadow: 0 0 0 3px {{s.ring}}"></span>
          {{s.name}}
          <span style="font-size: 12px; color: #CFE0C3">{{s.state}}</span>
        </span>
      </sc-for>
    </div>
  </header>

  <main style="max-width: 1120px; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-direction: column; gap: 28px">

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 48px; color: #2F4A32; line-height: 1.05">AgroPilot</h1>
      </div>
      <button style="display: inline-flex; align-items: center; gap: 8px; background: #2F4A32; color: #FBF6EC; border: 0; border-radius: 10px; padding: 12px 20px; font: 600 15px Inter, sans-serif; cursor: pointer; min-height: 44px">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
        Add farm
      </button>
    </div>

    <sc-for list="{{farms}}" as="farm" hint-placeholder-count="3">
      <section style="background: #FBF6EC; border: 1px solid #D9C7A8; border-radius: 16px; overflow: hidden">
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 24px; background: #E8DAC0; border-bottom: 1px solid #D9C7A8">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #6B4F35">Farm</span>
            <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 26px; color: #3B2A1C">{{farm.name}}</h2>
          </div>
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="font-size: 14px; color: #6B4F35">{{farm.count}}</span>
            <button style="display: inline-flex; align-items: center; gap: 6px; background: transparent; color: #2F4A32; border: 1.5px solid #2F4A32; border-radius: 10px; padding: 10px 16px; font: 600 14px Inter, sans-serif; cursor: pointer; min-height: 44px">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
              Add plot
            </button>
          </div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 16px; padding: 24px">
          <sc-for list="{{farm.plots}}" as="plot" hint-placeholder-count="2">
            <a href="Plot.dc.html" style="flex: 1 1 260px; max-width: 340px; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #D9C7A8; border-radius: 14px; overflow: hidden; text-decoration: none; color: #3B2A1C">
              <sc-if value="{{plot.hasPhoto}}" hint-placeholder-val="{{ false }}">
                <div style="height: 140px; background: #5E7748; display: flex; align-items: center; justify-content: center; gap: 8px; color: #F3EBDD; font-size: 13px; font-weight: 500">
                  <svg role="img" aria-label="Photo of the plot" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
                  Uploaded photo
                </div>
              </sc-if>
              <sc-if value="{{plot.noPhoto}}" hint-placeholder-val="{{ true }}">
                <div style="position: relative; height: 140px">
                  <svg aria-hidden="true" width="100%" height="140" viewBox="0 0 320 140" preserveAspectRatio="xMidYMid slice"><rect width="320" height="140" fill="#EADFC8"/><circle cx="262" cy="34" r="16" fill="#D9B66A"/><path d="M0 72 Q80 44 170 66 T320 58 V140 H0Z" fill="#A3B57F"/><path d="M0 92 Q110 74 210 88 T320 84 V140 H0Z" fill="#6E8A4E"/><path d="M0 112 Q120 100 320 108 V140 H0Z" fill="#8B6B47"/><path d="M20 140 L120 108 M80 140 L150 107 M140 140 L180 107 M200 140 L210 108 M260 140 L240 108 M310 140 L270 109" stroke="#6F5235" stroke-width="2"/></svg>
                  <span style="position: absolute; top: 10px; left: 10px; background: rgba(251,246,236,0.92); color: #6B4F35; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600">No photo yet</span>
                </div>
              </sc-if>
              <div style="padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 10px">
              <span style="font-size: 18px; font-weight: 600">{{plot.name}}</span>
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
                <span style="font-size: 15px; color: #6B4F35">{{plot.crop}}</span>
                <sc-if value="{{plot.growing}}" hint-placeholder-val="{{ true }}">
                  <span style="display: inline-flex; align-items: center; gap: 5px; background: #DCE8D2; color: #2F4A32; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600">
                    <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-8M12 12c0-4 3-6 7-6 0 4-3 6-7 6zM12 14c0-3-2-5-6-5 0 3 2 5 6 5z"/></svg>
                    Growing
                  </span>
                </sc-if>
                <sc-if value="{{plot.ended}}" hint-placeholder-val="{{ false }}">
                  <span style="display: inline-flex; align-items: center; gap: 5px; background: #EDE3D1; color: #6B4F35; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600">
                    <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
                    Season ended
                  </span>
                </sc-if>
              </div>
              <div style="display: flex; gap: 16px; font-size: 14px; color: #6B4F35; border-top: 1px solid #EFE4D2; padding-top: 10px">
                <span>{{plot.area}}</span>
                <span>Planted {{plot.planted}}</span>
              </div>
              </div>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showServiceDown":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":1660}}'>
class Component extends DCLogic {
renderVals() {
const down = this.props.showServiceDown ?? false;
const up = { dot: '#6FCF7F', ring: 'rgba(111,207,127,0.25)', state: 'up' };
const off = { dot: '#E5484D', ring: 'rgba(229,72,77,0.3)', state: 'down' };
const p = (name, crop, growing, area, planted, photo) => ({ name, crop, growing, ended: !growing, area, planted, hasPhoto: !!photo, noPhoto: !photo });
return {
services: [
{ name: 'Registry', ...up },
{ name: 'Weather', ...(down ? off : up) },
{ name: 'Planner', ...up }
],
farms: [
{ name: 'Demo cooperative', count: '2 plots', plots: [
p('North block', 'Tomato', false, '1,000 m²', '2026-03-01'),
p('East block', 'Bell pepper', false, '800 m²', '2026-04-12')
] },
{ name: 'East farm', count: '2 plots', plots: [
p('West block', 'Tomato', false, '1,500 m²', '2026-02-15'),
p('Greenhouse', 'Bell pepper', false, '400 m²', '2026-05-01')
] },
{ name: 'Jezreel Valley farm', count: '1 plot', plots: [
p('Valley block', 'Tomato', true, '1,200 m²', '2026-10-05', true)
] }
]
};
}
}
</script>
</body>
</html>
