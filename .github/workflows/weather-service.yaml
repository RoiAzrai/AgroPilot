name: weather-service

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# uv run from services/<service> does not see the root .python-version, so without this
# CI would pick the newest Python (3.14). Pin it to match development (3.12).
# TODO (stage 6): make code/tests independent of the Python version and test 3.12 + 3.14.
env:
  UV_PYTHON: "3.12"

defaults:
  run:
    working-directory: services/weather-service

jobs:
  test:
    name: weather-service / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --locked

      - name: Show Python version
        run: uv run python --version

      - name: Run tests
        run: uv run pytest

  audit:
    name: weather-service / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command
