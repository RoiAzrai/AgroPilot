name: weather-service

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: services/weather-service

jobs:
  test:
    name: weather-service / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  audit:
    name: weather-service / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command
