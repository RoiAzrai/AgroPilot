name: registry-service

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# uv run from services/<service> does not see the root .python-version, so without this
# CI would pick the newest Python (3.14). Pin it to match development (3.12).
# TODO (stage 6): make code/tests independent of the Python version and test 3.12 + 3.14.
env:
  UV_PYTHON: "3.12"

defaults:
  run:
    working-directory: services/registry-service

jobs:
  test:
    name: registry-service / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --locked

      - name: Show Python version
        run: uv run python --version

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: services/registry-service/htmlcov/

  audit:
    name: registry-service / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command
