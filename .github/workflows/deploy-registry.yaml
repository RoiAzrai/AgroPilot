name: deploy-registry

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            APP=/home/ubuntu/AgroPilot
            UV=/home/ubuntu/.local/bin/uv

            # preflight checks
            command -v git >/dev/null || { echo "git missing"; exit 1; }
            [ -x "$UV" ] || { echo "uv missing at $UV"; exit 1; }
            [ -d "$APP/.git" ] || { echo "repo missing at $APP"; exit 1; }
            [ -f "$APP/services/registry-service/.env" ] || { echo ".env missing"; exit 1; }

            # remember previous commit for rollback
            PREV=$(git -C "$APP" rev-parse HEAD)

            cd "$APP"
            git fetch origin main
            git reset --hard ${{ github.sha }}

            cd services/registry-service
            "$UV" sync --locked
            sudo systemctl restart registry.service

            # health check with retries
            for i in 1 2 3 4 5; do
              sleep 2
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health || true)
              if [ "$code" = "200" ]; then
                echo "healthy"
                exit 0
              fi
            done

            # automatic rollback
            echo "unhealthy, rolling back to $PREV"
            git -C "$APP" reset --hard "$PREV"
            (cd "$APP/services/registry-service" && "$UV" sync --locked)
            sudo systemctl restart registry.service
            exit 1
